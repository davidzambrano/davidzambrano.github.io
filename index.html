<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>David Zambrano - QA Automation Engineer</title>
<meta name="description" content="David Zambrano, QA Automation Engineer in Barcelona. Test automation portfolio: Playwright, Python, pytest, CI/CD pipelines, and live Allure reports.">
<meta name="theme-color" content="#0c0d0c">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0d0c'/%3E%3Ctext x='6' y='22' font-family='ui-monospace,monospace' font-size='16' fill='%234ec9b0'%3E%3E_%3C/text%3E%3C/svg%3E">

<meta property="og:type" content="website">
<meta property="og:title" content="David Zambrano, QA Automation Engineer">
<meta property="og:description" content="Test automation portfolio: Playwright, Python, pytest, CI/CD pipelines, and live Allure reports.">
<meta property="og:url" content="https://davidzambrano.github.io/">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="David Zambrano, QA Automation Engineer">
<meta name="twitter:description" content="Test automation portfolio: Playwright, Python, pytest, CI/CD pipelines, and live Allure reports.">
<style>
  :root{
    --bg: #0c0d0c;
    --bg-alt: #121312;
    --text: #d8dcd6;
    --muted: #6d726c;
    --line: #26281f;
    --accent: #4ec9b0;
    --accent-dim: #2f7d6d;
    --amber: #c9a24b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", "Courier New", monospace;
    font-size: 13.5px;
    line-height: 1.6;
  }

  body {
    max-width: 700px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  ::selection { background: var(--accent-dim); color: #fff; }

  /* ---------- FILE LINKS ---------- */

  .nav-links {
    margin-top: 20px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    font-size: 13px;
  }

  .nav-links a { color: var(--accent); }
  .nav-links a:hover { text-decoration: underline; }

  .nav-links .copy-toast {
    color: var(--accent);
    font-size: 11px;
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .nav-links .copy-toast.show { opacity: 1; }

  /* ---------- CONTENT SECTIONS ---------- */

  .reveal-target {
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .reveal-target.visible {
    opacity: 1;
    transform: none;
  }

  section {
    margin-top: 32px;
  }

  #projects .path {
    color: var(--muted);
    font-size: 12px;
    margin: 0 0 4px;
  }
  #projects .path a { color: var(--muted); }
  #projects .path a:hover { color: var(--accent); }

  section h2.index-title {
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 10px;
  }

  #projects hr {
    border: none;
    border-top: 1px solid var(--line);
    margin: 0 0 14px;
  }

  /* ---------- PROJECTS TABLE ---------- */

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    text-align: left;
    color: var(--muted);
    font-weight: 400;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 6px 8px;
    border-bottom: 1px solid var(--line);
  }

  tbody tr {
    border-bottom: 1px solid var(--line);
  }

  td {
    padding: 9px 8px;
    vertical-align: top;
  }

  td.name a { color: var(--text); }
  td.name a:hover { color: var(--accent); }
  tr.up a { color: var(--text); }
  tr.up a:hover { color: var(--accent); }
  td.name .tag {
    color: var(--muted);
    display: block;
    font-size: 12px;
    margin-top: 3px;
  }

  td.stat-cell { color: var(--muted); white-space: nowrap; }
  td.report-cell { white-space: nowrap; }

  /* ---------- TERMINAL (secondary, below the fold) ---------- */

  .term-section.hero {
    margin-bottom: 36px;
  }

  .term-section .hint {
    color: var(--muted);
    font-size: 12px;
    margin: 0 0 12px;
  }

  .term {
    border: 1px solid var(--line);
    background: var(--bg-alt);
    border-radius: 4px;
    overflow: hidden;
  }

  .term-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: #0f100e;
  }

  .dot {
    position: relative;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #3a3c36;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .dot::before {
    content: '';
    position: absolute;
    top: -6px; left: -6px; right: -6px; bottom: -6px;
  }
  .dot:hover {
    background: var(--accent);
    box-shadow: 0 0 6px 0 var(--accent);
  }

  .term-title {
    margin-left: 8px;
    color: var(--muted);
    font-size: 12px;
  }

  .term-body {
    padding: 16px 18px 20px;
    white-space: pre-wrap;
  }

  .prompt { color: var(--muted); }
  .cmd { color: var(--text); }
  .out { color: var(--accent); }
  .out-muted { color: var(--muted); }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 1em;
    background: var(--accent);
    vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .live-row { display: flex; align-items: center; }
  .term-input {
    flex: 1;
    min-width: 40px;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font: inherit;
    caret-color: var(--accent);
    padding: 0;
    margin: 0;
  }
  .term-input.pw {
    -webkit-text-security: disc;
    text-security: disc;
  }

  /* ---------- FOOTER ---------- */

  footer {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
  }

  @media (max-width: 600px) {
    body { font-size: 13px; }
  }
</style>
</head>
<body>

  <div class="term-section hero">
    <div class="term">
      <div class="term-bar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="term-title">david.zambrano@qa-automation: ~</span>
      </div>
      <div class="term-body" id="termBody"></div>
    </div>
  </div>

  <section id="projects" class="reveal-target">
    <p class="path"><a href="#">~</a> / <a href="#">david-zambrano</a></p>
    <h2 class="index-title">Index of /david-zambrano</h2>
    <hr>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Tests</th>
          <th>Allure</th>
        </tr>
      </thead>
      <tbody>
        <tr class="up">
          <td class="name" colspan="3"><a href="#">../</a></td>
        </tr>
        <tr>
          <td class="name"><a href="https://github.com/davidzambrano/playwright-playground" target="_blank" rel="noopener">playwright-playground/</a> <span class="tag">[UI · playwright · python · pytest · sonarcloud]</span></td>
          <td class="stat-cell">206 tests</td>
          <td class="report-cell"><a href="https://davidzambrano.github.io/playwright-playground/main/" target="_blank" rel="noopener">Report →</a></td>
        </tr>
      </tbody>
    </table>

    <div class="nav-links">
      <a href="https://linkedin.com/in/davidlzg" target="_blank" rel="noopener">linkedin.txt</a>
      <a href="https://github.com/davidzambrano" target="_blank" rel="noopener">github.txt</a>
      <a href="#" onclick="copyEmail(event)" id="contactLink">contact.txt</a>
      <span class="copy-toast" id="copyToast">copied ✓</span>
    </div>
  </section>

  <footer class="reveal-target">
    <span>Last deployed: 2026-08-09 14:32 UTC via GitHub Actions</span>
  </footer>

<script>
  function copyEmail(e) {
    e.preventDefault();
    const email = 'davidzambrano.sdet@gmail.com';
    const toast = document.getElementById('copyToast');

    function showToast() {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(email).then(showToast).catch(() => {
        window.location.href = 'mailto:' + email;
      });
    } else {
      window.location.href = 'mailto:' + email;
    }
  }

  const lines = [
    { type: 'cmd', prompt: '$ ', text: 'whoami' },
    { type: 'out', text: 'David Zambrano, QA Automation Engineer @ SEIDOR Opentrends, Barcelona' },
    { type: 'cmd', prompt: '$ ', text: 'cat skills.txt' },
    { type: 'out', text: 'Selenium · Playwright · Python · pytest · GitHub Actions · Kafka · Allure' },
    { type: 'cmd', prompt: '$ ', text: 'uptime' },
    { type: 'out-muted', text: '4y 0m, QA automation, no downtime' },
    { type: 'cmd', prompt: '$ ', text: 'cat now.txt' },
    { type: 'out-muted', text: 'reducing flaky tests and tightening CI feedback loops' },
    { type: 'cmd', prompt: '$ ', text: 'ls -la ./' },
  ];

  const body = document.getElementById('termBody');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function renderStatic() {
    body.innerHTML = '';
    lines.forEach(l => {
      const div = document.createElement('div');
      if (l.type === 'cmd') {
        div.innerHTML = `<span class="prompt">${l.prompt}</span><span class="cmd">${l.text}</span>`;
      } else {
        div.innerHTML = `<span class="${l.type}">${l.text}</span>`;
      }
      body.appendChild(div);
    });
    revealIndex();
    enableInteractive();
  }

  async function typeLines() {
    for (const l of lines) {
      const div = document.createElement('div');
      body.appendChild(div);
      if (l.type === 'cmd') {
        const promptSpan = document.createElement('span');
        promptSpan.className = 'prompt';
        promptSpan.textContent = l.prompt;
        div.appendChild(promptSpan);
        const cmdSpan = document.createElement('span');
        cmdSpan.className = 'cmd';
        div.appendChild(cmdSpan);
        for (const ch of l.text) {
          cmdSpan.textContent += ch;
          await new Promise(r => setTimeout(r, 22));
        }
        await new Promise(r => setTimeout(r, 120));
      } else {
        div.innerHTML = `<span class="${l.type}">${l.text}</span>`;
        await new Promise(r => setTimeout(r, 180));
      }
    }
    revealIndex();
    enableInteractive();
  }

  function revealIndex() {
    document.getElementById('projects').classList.add('visible');
    document.querySelector('footer').classList.add('visible');
  }

  let sudoAttempts = 0;
  let inPasswordMode = false;

  const responses = {
    help: 'available: whoami, skills, now, uptime, ls, contact, sudo',
    whoami: 'david-zambrano',
    skills: 'Selenium · Playwright · Python · pytest · GitHub Actions · Kafka · Allure',
    now: 'reducing flaky tests and tightening CI feedback loops',
    uptime: '4y 0m, QA automation, no downtime',
    ls: 'about.txt  achievements.txt  skills.txt  certifications.txt  projects/',
    contact: 'davidzambrano.sdet@gmail.com, linkedin.com/in/davidlzg',
  };

  function addLine(html) {
    const div = document.createElement('div');
    div.innerHTML = html;
    body.insertBefore(div, document.getElementById('liveRow'));
  }

  function promptLabel() {
    return inPasswordMode ? `[sudo] password for david: ` : `$ `;
  }

  function resetPrompt() {
    inPasswordMode = false;
    document.getElementById('livePrompt').textContent = promptLabel();
    const input = document.getElementById('termInput');
    input.classList.remove('pw');
    input.value = '';
  }

  function handleCommand(raw) {
    const cmd = raw.trim();

    if (inPasswordMode) {
      addLine(`<span class="prompt">[sudo] password for david: </span><span class="cmd">${'•'.repeat(cmd.length)}</span>`);
      addLine(`<span class="out-muted">david is not in the sudoers file. This incident will be reported.</span>`);
      resetPrompt();
      return;
    }

    addLine(`<span class="prompt">$ </span><span class="cmd">${cmd || ''}</span>`);

    if (!cmd) return;

    if (cmd.startsWith('sudo')) {
      inPasswordMode = true;
      sudoAttempts = 0;
      document.getElementById('livePrompt').textContent = promptLabel();
      document.getElementById('termInput').classList.add('pw');
      return;
    }

    if (cmd === 'clear') {
      addLine(`<span class="out-muted">bash: clear: permission denied</span>`);
      return;
    }

    const key = cmd.toLowerCase().replace(/^cat\s+/, '').replace(/\.txt$/, '');
    if (responses[key]) {
      addLine(`<span class="out-muted">${responses[key]}</span>`);
    } else {
      const firstWord = cmd.split(' ')[0];
      addLine(`<span class="out-muted">bash: ${firstWord}: command not permitted</span>`);
    }
  }

  function enableInteractive() {
    const row = document.createElement('div');
    row.className = 'live-row';
    row.id = 'liveRow';
    row.innerHTML = `<span class="prompt" id="livePrompt">$ </span><span class="cursor" id="fakeCursor"></span><input id="termInput" class="term-input" autocomplete="off" autocapitalize="off" spellcheck="false" />`;
    body.appendChild(row);

    const input = document.getElementById('termInput');
    const fakeCursor = document.getElementById('fakeCursor');
    input.addEventListener('focus', () => fakeCursor.style.display = 'none');
    input.addEventListener('blur', () => fakeCursor.style.display = 'inline-block');
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = input.value;
        input.value = '';
        handleCommand(val);
      }
    });

    document.querySelector('.term').addEventListener('click', () => input.focus());
  }

  function lockInitialHeight() {
    const temp = document.createElement('div');
    temp.className = 'term-body';
    temp.style.visibility = 'hidden';
    temp.style.position = 'absolute';
    temp.style.top = '0';
    temp.style.left = '0';
    temp.style.pointerEvents = 'none';
    temp.style.width = body.offsetWidth + 'px';
    let html = '';
    lines.forEach(l => {
      if (l.type === 'cmd') {
        html += `<div><span class="prompt">${l.prompt}</span><span class="cmd">${l.text}</span></div>`;
      } else {
        html += `<div><span class="${l.type}">${l.text}</span></div>`;
      }
    });
    html += `<div class="live-row"><span class="prompt">$ </span><span class="cursor"></span><input class="term-input" /></div>`;
    temp.innerHTML = html;
    body.parentElement.appendChild(temp);
    const h = temp.offsetHeight;
    body.parentElement.removeChild(temp);
    body.style.minHeight = h + 'px';
  }

  lockInitialHeight();

  if (reduceMotion) {
    renderStatic();
  } else {
    typeLines();
  }
</script>

</body>
</html>
